name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed_problems:
        description: "Run prisma db seed after migrate (problems + test cases)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  migrate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Skip when production database is not configured
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL secret not set; skipping migrate (add it after Render Postgres is live)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Apply Prisma migrations
        if: steps.gate.outputs.configured == 'true'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  seed:
    needs: migrate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.seed_problems == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip when production database is not configured
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Seed problems and test cases
        if: steps.gate.outputs.configured == 'true'
        run: npx prisma db seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  render:
    needs: [migrate, seed]
    if: always() && needs.migrate.result == 'success' && (needs.seed.result == 'success' || needs.seed.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render API deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        if: env.DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK"
      - name: Trigger Render Web deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        if: env.DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK"

  aws-worker:
    needs: [migrate, seed]
    if: always() && needs.migrate.result == 'success' && (needs.seed.result == 'success' || needs.seed.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Skip when AWS SSH is not configured
        id: gate
        env:
          AWS_SSH_HOST: ${{ secrets.AWS_SSH_HOST }}
        run: |
          if [ -z "$AWS_SSH_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS_SSH_HOST not set; skipping worker deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy judge worker on AWS EC2
        if: steps.gate.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_SSH_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            APP_DIR="${{ secrets.AWS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="$HOME/codementor"; fi
            sudo mkdir -p /var/codementor-jobs
            sudo chmod 1777 /var/codementor-jobs
            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker build -t codementor-runner:1 workers/judge/docker
            docker compose -f docker-compose.worker.yml up -d --build
            docker compose -f docker-compose.worker.yml ps
