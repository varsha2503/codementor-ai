# Render Blueprint: Postgres, Redis, API, Web (worker runs on AWS EC2 — see docs/DEPLOY-AWS.md).
# After deploy: WEB_ORIGIN + API_UPSTREAM on web/api; for AWS worker add EC2 Elastic IP to codementor-redis ipAllowList (dashboard).

databases:
  - name: codementor-postgres
    plan: free
    databaseName: codementor
    user: codementor

services:
  - type: keyvalue
    name: codementor-redis
    plan: free
    maxmemoryPolicy: noeviction
    # Internal-only from Blueprint; AWS worker uses External Redis URL + your EC2 IP in Render dashboard → Networking.
    ipAllowList: []

  - type: web
    name: codementor-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    # Free tier: preDeployCommand is not allowed — run migrations via GitHub Actions
    # (DATABASE_URL secret) or once locally; see docs/DEPLOY.md
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codementor-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: codementor-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "4000"
      - key: WEB_ORIGIN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini

  - type: web
    name: codementor-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: API_UPSTREAM
        sync: false
